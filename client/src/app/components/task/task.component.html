<button class="btn btn-primary add-task-btn" type="button" (click)="startAdd()">+ Add task</button>

<div class="board" cdkDropListGroup>

  <div class="column">
    <div class="column-header">
      <span class="column-title">To Do</span>
      <span class="count-badge todo-badge">{{ todoTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_to_do"
         [cdkDropListData]="todoTasks"
         (cdkDropListDropped)="onDrop($event)">

      <!-- New task inline form -->
      <div class="task-card todo-card editing-card" *ngIf="addingNew">
        <div class="edit-wrapper">
          <textarea class="edit-input" appAutoFocus placeholder="Enter task..."
                    [(ngModel)]="newTaskTitle"
                    (keydown)="onAddKeydown($event)"
                    #ei (input)="autoResize(ei)"></textarea>
          <div class="edit-actions">
            <button class="btn btn-small btn-primary" type="button" (click)="saveAdd()">Save</button>
            <button class="btn btn-small btn-secondary" type="button" (click)="cancelAdd()">Cancel</button>
          </div>
        </div>
      </div>

      <div *ngFor="let task of todoTasks; trackBy: trackById" cdkDrag class="task-card todo-card"
           [class.editing-card]="editingId === task._id"
           [cdkDragDisabled]="editingId === task._id">
        <ng-container *ngIf="editingId === task._id; else vTodo">
          <div class="edit-wrapper">
            <textarea class="edit-input" appAutoFocus
                      [(ngModel)]="editingTitle"
                      (keydown)="onEditKeydown($event)"
                      #ei (input)="autoResize(ei)"></textarea>
            <div class="edit-actions">
              <button class="btn btn-small btn-primary" type="button" (click)="saveEdit(task)">Save</button>
              <button class="btn btn-small btn-secondary" type="button" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        </ng-container>
        <ng-template #vTodo>
          <div class="markdown-body" [innerHTML]="task.title | markdown" (click)="onCheckboxClick($event, task)"></div>
          <div class="card-actions">
            <button class="action-btn" type="button" (click)="startEdit(task)" title="Edit">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="column">
    <div class="column-header">
      <span class="column-title">In Progress</span>
      <span class="count-badge doing-badge">{{ doingTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_doing"
         [cdkDropListData]="doingTasks"
         (cdkDropListDropped)="onDrop($event)">
      <div *ngFor="let task of doingTasks; trackBy: trackById" cdkDrag class="task-card doing-card"
           [class.editing-card]="editingId === task._id"
           [cdkDragDisabled]="editingId === task._id">
        <ng-container *ngIf="editingId === task._id; else vDoing">
          <div class="edit-wrapper">
            <textarea class="edit-input" appAutoFocus
                      [(ngModel)]="editingTitle"
                      (keydown)="onEditKeydown($event)"
                      #ei (input)="autoResize(ei)"></textarea>
            <div class="edit-actions">
              <button class="btn btn-small btn-primary" type="button" (click)="saveEdit(task)">Save</button>
              <button class="btn btn-small btn-secondary" type="button" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        </ng-container>
        <ng-template #vDoing>
          <div class="markdown-body" [innerHTML]="task.title | markdown" (click)="onCheckboxClick($event, task)"></div>
          <div class="card-actions">
            <button class="action-btn" type="button" (click)="startEdit(task)" title="Edit">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <div class="column">
    <div class="column-header">
      <span class="column-title">Done</span>
      <span class="count-badge done-badge">{{ doneTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_done"
         [cdkDropListData]="doneTasks"
         (cdkDropListDropped)="onDrop($event)">
      <div *ngFor="let task of doneTasks; trackBy: trackById" cdkDrag class="task-card done-card"
           [class.editing-card]="editingId === task._id"
           [cdkDragDisabled]="editingId === task._id">
        <ng-container *ngIf="editingId === task._id; else vDone">
          <div class="edit-wrapper">
            <textarea class="edit-input" appAutoFocus
                      [(ngModel)]="editingTitle"
                      (keydown)="onEditKeydown($event)"
                      #ei (input)="autoResize(ei)"></textarea>
            <div class="edit-actions">
              <button class="btn btn-small btn-primary" type="button" (click)="saveEdit(task)">Save</button>
              <button class="btn btn-small btn-secondary" type="button" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        </ng-container>
        <ng-template #vDone>
          <div class="markdown-body" [innerHTML]="task.title | markdown" (click)="onCheckboxClick($event, task)"></div>
          <div class="card-actions">
            <button class="action-btn" type="button" (click)="startEdit(task)" title="Edit">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" *ngIf="pendingDeleteId" (click)="cancelDelete()">
  <div class="modal" (click)="$event.stopPropagation()">
    <p class="modal-title">Delete this task?</p>
    <p class="modal-body">This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" type="button" (click)="cancelDelete()">Cancel</button>
      <button class="btn btn-danger" type="button" (click)="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
