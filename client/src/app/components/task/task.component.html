<form class="add-form" (submit)="addTask(title.value); title.value = ''; $event.preventDefault()">
  <input class="add-input" type="text" placeholder="Add a new task…" autocomplete="off" #title>
  <button class="btn btn-primary" type="submit">Add task</button>
</form>

<div class="board" cdkDropListGroup>

  <div class="column">
    <div class="column-header">
      <span class="column-title">To Do</span>
      <span class="count-badge todo-badge">{{ todoTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_to_do"
         [cdkDropListData]="todoTasks"
         (cdkDropListDropped)="onDrop($event)">
      <div *ngFor="let task of todoTasks" cdkDrag class="task-card todo-card">
        <span class="task-title">{{ task.title }}</span>
        <button class="delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
      </div>
    </div>
  </div>

  <div class="column">
    <div class="column-header">
      <span class="column-title">In Progress</span>
      <span class="count-badge doing-badge">{{ doingTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_doing"
         [cdkDropListData]="doingTasks"
         (cdkDropListDropped)="onDrop($event)">
      <div *ngFor="let task of doingTasks" cdkDrag class="task-card doing-card">
        <span class="task-title">{{ task.title }}</span>
        <button class="delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
      </div>
    </div>
  </div>

  <div class="column">
    <div class="column-header">
      <span class="column-title">Done</span>
      <span class="count-badge done-badge">{{ doneTasks.length }}</span>
    </div>
    <div class="task-list" cdkDropList id="col_done"
         [cdkDropListData]="doneTasks"
         (cdkDropListDropped)="onDrop($event)">
      <div *ngFor="let task of doneTasks" cdkDrag class="task-card done-card">
        <span class="task-title">{{ task.title }}</span>
        <button class="delete-btn" type="button" (click)="deleteTask(task._id)" title="Delete">&#x2715;</button>
      </div>
    </div>
  </div>

</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" *ngIf="pendingDeleteId" (click)="cancelDelete()">
  <div class="modal" (click)="$event.stopPropagation()">
    <p class="modal-title">Delete this task?</p>
    <p class="modal-body">This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" type="button" (click)="cancelDelete()">Cancel</button>
      <button class="btn btn-danger" type="button" (click)="confirmDelete()">Delete</button>
    </div>
  </div>
</div>
