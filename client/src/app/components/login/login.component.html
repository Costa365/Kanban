<div class="account-shell">
  <div class="account-card">
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
    <div class="error" role="alert" *ngIf="error">{{ error }}</div>
    <div class="message" role="status" *ngIf="message">{{ message }}</div>

    <form *ngIf="!completed && !invalidLink" (ngSubmit)="submit()">
      <ng-container *ngIf="needsEmail">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" [(ngModel)]="email" name="email"
          required maxlength="254" autocomplete="username" [disabled]="loading">
      </ng-container>
      <ng-container *ngIf="needsPassword">
        <label for="password">{{ mode === 'reset' ? 'New password' : 'Password' }}</label>
        <app-password-input inputId="password" [(ngModel)]="password" name="password"
          [minlength]="needsConfirmation ? 8 : 1" [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'"
          [disabled]="loading"></app-password-input>
        <p class="help" *ngIf="needsConfirmation">Use at least 8 characters. Maximum 72 UTF-8 bytes (usually 72 characters).</p>
      </ng-container>
      <ng-container *ngIf="needsConfirmation">
        <label for="confirm-password">Confirm password</label>
        <app-password-input inputId="confirm-password" [(ngModel)]="confirmPassword" name="confirmPassword"
          autocomplete="new-password" [minlength]="8" [disabled]="loading"></app-password-input>
      </ng-container>
      <button class="action" type="submit" [disabled]="loading">{{ buttonText }}</button>
    </form>

    <div class="links">
      <a routerLink="/login" *ngIf="mode !== 'login'">Back to sign in</a>
      <a routerLink="/signup" *ngIf="mode === 'login'">Create an account</a>
      <a routerLink="/forgot-password" *ngIf="mode === 'login' || mode === 'reset'">Forgot password?</a>
      <a routerLink="/resend-verification" *ngIf="mode === 'login' || mode === 'signup' || mode === 'verify'"
        [queryParams]="email ? { email: email } : {}">Resend verification</a>
    </div>
  </div>
</div>
