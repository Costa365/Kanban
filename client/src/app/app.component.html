<header class="app-header">
  <span class="brand">Kanban</span>
  <nav *ngIf="authService.isLoggedIn()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Board</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
  </nav>
  <div class="spacer" *ngIf="!authService.isLoggedIn()"></div>
  <div class="header-right">
    <ng-container *ngIf="authService.isLoggedIn()">
      <span class="user-email">{{ authService.getEmail() }}</span>
      <button class="sign-out-btn" type="button" (click)="logout()" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </ng-container>
    <button class="theme-toggle" type="button" (click)="toggleTheme()"
            [title]="theme === 'light' ? 'Switch to dark mode' : 'Switch to light mode'">
      <ng-container *ngIf="theme === 'light'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </ng-container>
      <ng-container *ngIf="theme === 'dark'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </ng-container>
    </button>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
