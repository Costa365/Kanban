services:
  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-brevo}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Kanban}
      - APP_URL=${APP_URL:-http://localhost}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
    networks:
      default:
        aliases:
          - kanban-server-1
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
